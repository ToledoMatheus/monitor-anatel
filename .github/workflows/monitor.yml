name: Monitor Anatel diario

# Roda todos os dias util as 09:00 (horario de Brasilia = UTC-3 => 12:00 UTC)
# Ajuste o cron se quiser outro horario.
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:  # permite rodar manualmente pela aba "Actions"

permissions:
  contents: write  # necessario para commitar o banco atualizado

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT_PREFIX: "[Monitor Anatel]"
          SEND_EMAIL_IF_NO_CHANGES: ${{ vars.SEND_EMAIL_IF_NO_CHANGES || '0' }}
        run: python monitor_anatel.py

      - name: Commitar estado e relatorio
        run: |
          git config user.name  "monitor-anatel-bot"
          git config user.email "monitor-anatel-bot@users.noreply.github.com"
          git add anatel_state.sqlite3 relatorios/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar estado e relatorio - $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Nada para commitar."
          fi
